ätigung FrankiHolz erreicht.','Buchungsstatus prüfen','← Zurück zu FrankiHolz']};function a(){document.documentElement.lang=l;localStorage.setItem('frankiholz-lang',l);['kicker','title','lead','statusLink','homeLink'].forEach((id,i)=>document.getElementById(id).textContent=t[l][i]);document.getElementById('statusLink').href='/booking-status?lang='+l;document.getElementById('homeLink').href='/?lang='+l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l))}document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>{l=b.dataset.lang;a()});a();</script></body></html>
