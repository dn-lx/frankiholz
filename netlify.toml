# FrankiHolz v2 — isolated branch configuration. Production main/develop remain unchanged.
[build]
  base = "v2"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# This existing Netlify site began as a static site. Explicitly activate the
# supported Next.js adapter so .next is packaged with its route handlers.
[[plugins]]
  package = "@netlify/plugin-nextjs"
