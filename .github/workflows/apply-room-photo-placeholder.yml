name: Apply room photo placeholder

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-room-photo-placeholder.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - name: Replace room fallback photos with upload-soon message
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/site.js')
          s=p.read_text()

          old="const $=id=>document.getElementById(id), tr=k=>T[currentLang][k]||T.en[k]||k;"
          new="const $=id=>document.getElementById(id), tr=k=>T[currentLang][k]||T.en[k]||k, photoSoon=()=> 'Will be uploaded soon';"
          assert s.count(old)==1, 'translation helper anchor changed'
          s=s.replace(old,new)

          old="function roomImgs(id){return images.filter(x=>x.room_id===id)} function cover(r){const ri=roomImgs(r.id)[0];return ri?publicUrl(ri.storage_path):(r.image_url||fallbackHero)}"
          new="function roomImgs(id){return images.filter(x=>x.room_id===id)} function cover(r){const ri=roomImgs(r.id)[0];return ri?publicUrl(ri.storage_path):(r.image_url||null)}"
          assert s.count(old)==1, 'cover helper anchor changed'
          s=s.replace(old,new)

          old='''function renderRooms(){$('rooms').innerHTML=rooms.map(r=>`<article class="room-card"><img src="${cover(r)}" alt="${escapeHtml(roomName(r))}"><div class="room-body"><h3>${escapeHtml(roomName(r))}</h3><div class="muted">${tr('upTo')} ${r.max_guests} ${r.max_guests===1?tr('guestSingular'):tr('guestPlural')}</div><p>${escapeHtml(roomDesc(r))}</p><div class="price">${money(r.base_price)} <span class="muted" style="font-size:14px">${tr('night')}</span></div><button class="btn" onclick="selectRoom('${r.id}')" style="margin-top:14px">${tr('viewAvailability')}</button></div></article>`).join('')||`<div class="empty">${tr('noRooms')}</div>`;$('roomSelect').innerHTML=rooms.map(r=>`<option value="${r.id}" ${selectedRoom?.id===r.id?'selected':''}>${escapeHtml(roomName(r))}</option>`).join('')}'''
          new='''function renderRooms(){$('rooms').innerHTML=rooms.map(r=>`<article class="room-card">${cover(r)?`<img src="${cover(r)}" alt="${escapeHtml(roomName(r))}">`:`<div role="img" aria-label="${photoSoon()}" style="width:100%;height:260px;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--brand-ice),var(--brand-mint));color:var(--muted);font-weight:800;text-align:center">${photoSoon()}</div>`}<div class="room-body"><h3>${escapeHtml(roomName(r))}</h3><div class="muted">${tr('upTo')} ${r.max_guests} ${r.max_guests===1?tr('guestSingular'):tr('guestPlural')}</div><p>${escapeHtml(roomDesc(r))}</p><div class="price">${money(r.base_price)} <span class="muted" style="font-size:14px">${tr('night')}</span></div><button class="btn" onclick="selectRoom('${r.id}')" style="margin-top:14px">${tr('viewAvailability')}</button></div></article>`).join('')||`<div class="empty">${tr('noRooms')}</div>`;$('roomSelect').innerHTML=rooms.map(r=>`<option value="${r.id}" ${selectedRoom?.id===r.id?'selected':''}>${escapeHtml(roomName(r))}</option>`).join('')}'''
          assert s.count(old)==1, 'room card renderer anchor changed'
          s=s.replace(old,new)

          old='''function renderSelectedRoom(){const ri=roomImgs(selectedRoom.id),urls=ri.length?ri.map(x=>publicUrl(x.storage_path)):[cover(selectedRoom)];$('galleryMain').src=urls[0];$('galleryMain').alt=roomName(selectedRoom);$('selectedRoomName').textContent=roomName(selectedRoom);$('selectedRoomDescription').textContent=roomDesc(selectedRoom);$('selectedRoomPrice').innerHTML=`${money(selectedRoom.base_price)} <span class="muted" style="font-size:14px">${tr('night')}</span>`;$('thumbs').innerHTML=urls.map((u,k)=>`<button class="thumb ${k===0?'active':''}" type="button" onclick="showPhoto('${u.replace(/'/g,'%27')}',this)"><img src="${u}" alt="${escapeHtml(roomName(selectedRoom))} ${k+1}"></button>`).join('');$('guestCount').innerHTML=Array.from({length:selectedRoom.max_guests},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}'''
          new='''function renderSelectedRoom(){const ri=roomImgs(selectedRoom.id),fallback=cover(selectedRoom),urls=ri.length?ri.map(x=>publicUrl(x.storage_path)):(fallback?[fallback]:[]);if(urls.length){$('galleryMain').style.display='block';$('galleryMain').src=urls[0];$('galleryMain').alt=roomName(selectedRoom);$('thumbs').innerHTML=urls.map((u,k)=>`<button class="thumb ${k===0?'active':''}" type="button" onclick="showPhoto('${u.replace(/'/g,'%27')}',this)"><img src="${u}" alt="${escapeHtml(roomName(selectedRoom))} ${k+1}"></button>`).join('')}else{$('galleryMain').removeAttribute('src');$('galleryMain').alt='';$('galleryMain').style.display='none';$('thumbs').innerHTML=`<div role="img" aria-label="${photoSoon()}" style="grid-column:1/-1;width:100%;aspect-ratio:16/10;display:grid;place-items:center;padding:24px;border-radius:20px;background:linear-gradient(135deg,var(--brand-ice),var(--brand-mint));box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-weight:800;text-align:center">${photoSoon()}</div>`}$('selectedRoomName').textContent=roomName(selectedRoom);$('selectedRoomDescription').textContent=roomDesc(selectedRoom);$('selectedRoomPrice').innerHTML=`${money(selectedRoom.base_price)} <span class="muted" style="font-size:14px">${tr('night')}</span>`;$('guestCount').innerHTML=Array.from({length:selectedRoom.max_guests},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}'''
          assert s.count(old)==1, 'selected room renderer anchor changed'
          s=s.replace(old,new)

          p.write_text(s)
          PY
          node --check assets/site.js
          grep -Fq "photoSoon=()=> 'Will be uploaded soon'" assets/site.js
          grep -Fq "r.image_url||null" assets/site.js
          ! grep -Fq "r.image_url||fallbackHero" assets/site.js
      - name: Commit change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-room-photo-placeholder.yml
          git add assets/site.js .github/workflows/apply-room-photo-placeholder.yml
          git commit -m "Show upload-soon message when room photos are missing"
          git push origin develop
