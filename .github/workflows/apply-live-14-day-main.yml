name: Apply FrankiHolz live 14-day payment flow
on:
  push:
    branches: [main]
    paths:
      - scripts/apply-live-14-day-main.py
      - .github/workflows/apply-live-14-day-main.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply live payment patch
        run: python scripts/apply-live-14-day-main.py
      - name: Validate production payment routing
        run: |
          node --check assets/site.js
          node --check assets/email-hook.js
          grep -q "frankiholz_create_booking_payment_v2" assets/site.js
          grep -q "frankiholz-create-authorization-v2" assets/site.js
          grep -q "frankiholz-cancel-booking" assets/site.js
          grep -q "frankiholz_booking_status_v2" assets/site.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site.js assets/email-hook.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable live 14-day Stripe payment flow"
          git push origin main
