name: Deploy FrankiHolz staging to ShipStatic

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frankiholz-staging-shipstatic
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: shipstatic-staging
      url: ${{ steps.ship.outputs.url }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7

      - name: Install exact approved FrankiHolz logo from Drive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import hashlib
          file_id = "1QF0Hhrxdan6fk5lOv9XSVQ8427Xq-M7y"
          expected_sha = "cbc29dcb36419a3395bde838c88262b6c54891a00ecbff2cb74241c2d3796312"
          expected_size = 758364
          url = f"https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t"
          data = urlopen(Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise RuntimeError("Drive did not return the approved PNG")
          digest = hashlib.sha256(data).hexdigest()
          if len(data) != expected_size:
              raise RuntimeError(f"Approved logo size mismatch: {len(data)}")
          if digest != expected_sha:
              raise RuntimeError(f"Approved logo hash mismatch: {digest}")
          Path("assets/frankiholz-logo-approved.png").write_bytes(data)
          print(f"Installed exact approved logo ({len(data)} bytes, {digest})")
          PY

      - name: Build staging-safe static site
        run: python3 scripts/build-staging.py

      - name: Verify staging safety, branding and admin
        run: |
          grep -q "ShipStatic staging is always Stripe TEST" _site/assets/authorization-flow.js
          test ! -f _site/assets/staging-banner.js
          test -f _site/booking-status/index.html
          test -f _site/payment-success/index.html
          test -f _site/admin/index.html
          test -f _site/assets/frankiholz-logo-approved.png
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          data = Path('_site/assets/frankiholz-logo-approved.png').read_bytes()
          assert len(data) == 758364
          assert hashlib.sha256(data).hexdigest() == 'cbc29dcb36419a3395bde838c88262b6c54891a00ecbff2cb74241c2d3796312'
          html = Path('_site/index.html').read_text(encoding='utf-8')
          assert '/assets/frankiholz-logo-approved.png?v=20260912k' in html
          assert 'href="/admin/"' in html
          assert 'data:image/png;base64,' not in html
          admin = Path('_site/admin/index.html').read_text(encoding='utf-8')
          assert 'Secure management portal for FrankiHolz by FrankiFlow.' in admin
          assert 'FRANKIHOLZ STAGING' in admin
          assert 'Admin disabled on ShipStatic staging' not in admin
          PY
          ! grep -q "const mode=await paymentEnvironment();" _site/assets/authorization-flow.js

      - name: Deploy staging to ShipStatic
        id: ship
        uses: shipstatic/action@v2
        with:
          token: ${{ secrets.SHIP_TOKEN }}
          path: ./_site
          domain: ${{ vars.SHIP_DOMAIN || secrets.SHIP_DOMAIN }}
          labels: staging,frankiholz
