name: Deploy FrankiHolz develop to ShipStatic

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frankiholz-develop-shipstatic
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: shipstatic-staging
      url: https://frankiholz.shipstatic.com
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7

      - name: Install exact approved FrankiHolz logo from Drive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import hashlib
          file_id = "1QF0Hhrxdan6fk5lOv9XSVQ8427Xq-M7y"
          expected_sha = "cbc29dcb36419a3395bde838c88262b6c54891a00ecbff2cb74241c2d3796312"
          expected_size = 758364
          url = f"https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t"
          data = urlopen(Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise RuntimeError("Drive did not return the approved PNG")
          digest = hashlib.sha256(data).hexdigest()
          if len(data) != expected_size:
              raise RuntimeError(f"Approved logo size mismatch: {len(data)}")
          if digest != expected_sha:
              raise RuntimeError(f"Approved logo hash mismatch: {digest}")
          Path("assets/frankiholz-logo-approved.png").write_bytes(data)
          print(f"Installed exact approved logo ({len(data)} bytes, {digest})")
          PY

      - name: Build development-safe static site
        run: python3 scripts/build-staging.py

      - name: Verify development safety, branding and admin
        run: |
          grep -q "ShipStatic development is always Stripe TEST" _site/assets/authorization-flow.js
          grep -q "logoFallbackApplied" _site/assets/lang-fix.js
          test ! -f _site/assets/staging-banner.js
          test -f _site/booking-status/index.html
          test -f _site/payment-success/index.html
          test -f _site/admin/index.html
          test -f _site/assets/frankiholz-logo-approved.png
          test -f _site/ship.json
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re

          expected_size = 758364
          expected_sha = 'cbc29dcb36419a3395bde838c88262b6c54891a00ecbff2cb74241c2d3796312'

          asset = Path('_site/assets/frankiholz-logo-approved.png').read_bytes()
          assert len(asset) == expected_size
          assert hashlib.sha256(asset).hexdigest() == expected_sha

          html = Path('_site/index.html').read_text(encoding='utf-8')
          assert 'href="/admin/"' in html
          assert '/assets/frankiholz-logo-approved.png' not in html
          assert 'http-equiv="Cache-Control"' in html
          match = re.search(r'src="data:image/png;base64,([A-Za-z0-9+/=]+)"', html)
          assert match, 'Embedded FrankiHolz logo missing from development homepage'
          embedded = base64.b64decode(match.group(1))
          assert len(embedded) == expected_size
          assert hashlib.sha256(embedded).hexdigest() == expected_sha

          admin = Path('_site/admin/index.html').read_text(encoding='utf-8')
          assert 'Secure management portal for FrankiHolz by FrankiFlow.' in admin
          assert 'FRANKIHOLZ DEVELOPMENT' in admin
          assert 'Admin disabled on ShipStatic development' not in admin
          assert 'http-equiv="Cache-Control"' in admin
          admin_match = re.search(r'src="data:image/png;base64,([A-Za-z0-9+/=]+)"', admin)
          assert admin_match, 'Embedded FrankiHolz logo missing from development admin'
          admin_logo = base64.b64decode(admin_match.group(1))
          assert len(admin_logo) == expected_size
          assert hashlib.sha256(admin_logo).hexdigest() == expected_sha

          config = json.loads(Path('_site/ship.json').read_text(encoding='utf-8'))
          headers = config['headers'][0]['headers']
          cache = next(item['value'] for item in headers if item['key'] == 'Cache-Control')
          assert 'no-store' in cache and 'no-cache' in cache
          redirects = config.get('redirects', [])
          assert any(
              item.get('source') == '/assets/frankiholz-header-light.webp'
              and item.get('destination') == '/assets/frankiholz-logo-approved.png'
              for item in redirects
          ), 'Legacy FrankiHolz logo redirect missing'
          PY
          ! grep -q "const mode=await paymentEnvironment();" _site/assets/authorization-flow.js

      - name: Deploy development to ShipStatic
        id: ship
        uses: shipstatic/action@v2
        with:
          token: ${{ secrets.SHIP_TOKEN }}
          path: ./_site
          domain: frankiholz.shipstatic.com
          labels: development,frankiholz,develop

      - name: Verify permanent development URL
        env:
          DEV_DOMAIN: frankiholz.shipstatic.com
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "https://${DEV_DOMAIN}/?verify=${GITHUB_SHA}" -o /tmp/frankiholz-home.html; then
              break
            fi
            sleep 3
          done
          grep -q 'data:image/png;base64' /tmp/frankiholz-home.html
          status="$(curl -sS -o /tmp/legacy-logo.bin -w '%{http_code}' -L "https://${DEV_DOMAIN}/assets/frankiholz-header-light.webp?verify=${GITHUB_SHA}")"
          test "$status" = "200"
          python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/legacy-logo.bin').read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n'), 'Legacy logo URL did not resolve to PNG'
          PY
          curl -sS -D /tmp/cors-headers.txt -o /dev/null -X OPTIONS \
            'https://bdeajozhylypiidrldka.supabase.co/functions/v1/frankiholz-sync-airbnb' \
            -H "Origin: https://${DEV_DOMAIN}" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,apikey,x-frankiholz-source'
          grep -qi "^access-control-allow-origin: https://${DEV_DOMAIN}" /tmp/cors-headers.txt
