name: Apply FrankiHolz 14-day booking upgrades
on:
  push:
    branches: [develop]
    paths:
      - scripts/apply-sept-booking-upgrades.py
      - .github/workflows/apply-sept-booking-upgrades.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - name: Apply upgrades
        run: python scripts/apply-sept-booking-upgrades.py
      - name: Validate JavaScript and UI hooks
        run: |
          node --check assets/site.js
          node --check assets/email-hook.js
          grep -q 'guestAge' index.html
          grep -q 'guestLanguages' index.html
          grep -q 'cancellationPolicy' index.html
          grep -q 'frankiholz_create_booking_v2' assets/site.js
          grep -q 'frankiholz-create-authorization-test' assets/site.js
          grep -q 'frankiholz-cancel-booking-test' assets/site.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/site.js assets/email-hook.js assets/styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Implement FrankiHolz 14-day booking flow"
          git push origin develop
