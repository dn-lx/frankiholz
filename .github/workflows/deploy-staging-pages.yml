name: Deploy FrankiHolz staging to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frankiholz-staging-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6

      - name: Build staging-safe static site
        run: python3 scripts/build-pages-staging.py

      - name: Verify staging safety
        run: |
          grep -q "GitHub Pages staging is always Stripe TEST" _site/assets/authorization-flow.js
          test -f _site/.nojekyll
          test -f _site/booking-status/index.html
          test -f _site/payment-success/index.html
          ! grep -q "const mode=await paymentEnvironment();" _site/assets/authorization-flow.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/develop'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v4
