name: Apply FrankiHolz live v2 payment routing
on:
  push:
    branches: [develop]
    paths:
      - scripts/apply-live-v2-payment-routing.py
      - .github/workflows/apply-live-v2-payment-routing.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - name: Apply live payment routing
        run: python scripts/apply-live-v2-payment-routing.py
      - name: Validate routing
        run: |
          node --check assets/site.js
          grep -q "frankiholz-create-authorization-v2" assets/site.js
          grep -q "frankiholz-cancel-booking'" assets/site.js
          grep -q "frankiholz_booking_status_v2" assets/site.js
          grep -q "rpcName='frankiholz_create_booking_v2'" assets/site.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Route production through 14-day Stripe flow"
          git push origin develop
