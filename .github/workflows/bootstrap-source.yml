name: Bootstrap FrankiHolz website source

on:
  push:
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current FrankiHolz source package
        run: |
          set -euo pipefail
          rm -rf /tmp/frankiholz-source
          mkdir -p /tmp/frankiholz-source
          curl -L --fail --retry 3 'https://drive.google.com/uc?export=download&id=1OC-BVRHtBU7gJpyTlaGJErrscqnZlBq-' -o /tmp/frankiholz-source.zip
          unzip -q /tmp/frankiholz-source.zip -d /tmp/frankiholz-source
          test -f /tmp/frankiholz-source/index.html
          test -f /tmp/frankiholz-source/admin.html
          test -f /tmp/frankiholz-source/booking-status.html
          test -f /tmp/frankiholz-source/payment-success.html
          test -f /tmp/frankiholz-source/netlify.toml

      - name: Populate repository
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='README.md' \
            --exclude='DEPLOYMENT.md' \
            /tmp/frankiholz-source/ ./
          rm -f .github/workflows/bootstrap-source.yml
          cat > .gitignore <<'EOF'
          .DS_Store
          Thumbs.db
          .env
          .env.*
          !.env.example
          node_modules/
          .netlify/
          EOF

      - name: Validate source
        run: |
          set -euo pipefail
          test -s index.html
          test -s admin.html
          test -s assets/config.js
          grep -q 'FRANKIHOLZ_CONFIG' assets/config.js
          grep -q 'frankiholz' index.html

      - name: Commit populated production source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Populate current FrankiHolz production source'
          git push origin main
